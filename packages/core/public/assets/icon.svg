<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="milk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset=".55" stop-color="#F9F6EE"/>
      <stop offset="1" stop-color="#EFE9DD"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#121A28"/>
      <stop offset=".62" stop-color="#182337"/>
      <stop offset="1" stop-color="#24344E"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BD3BE"/>
      <stop offset="1" stop-color="#0E9488"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#25324A" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- milk-white rounded tile -->
  <rect width="512" height="512" rx="118" fill="url(#milk)"/>
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="#1B2433" stroke-opacity=".06" stroke-width="2"/>

  <!-- custom T: soft geometric monogram with a rounded stem -->
  <g filter="url(#soft)" fill="url(#ink)">
    <rect x="132" y="144" width="248" height="58" rx="29"/>
    <rect x="230" y="166" width="52" height="190" rx="26"/>
  </g>

  <!-- a single drop of colour, the ThodDrop signature -->
  <path d="M256 332c-3 26-30 44-30 70a30 30 0 0 0 60 0c0-26-27-44-30-70z" fill="url(#drop)"/>
</svg>
